<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kratos Space · Coming soon</title>
<meta name="description" content="Kratos: compact resistance training for microgravity. Coming soon. Contact us at info@kratos-space.ch.">
<meta name="theme-color" content="#05071a">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Michroma&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Coming-soon page: animated space background (canvas starfield + drifting
   nebula), the Kratos badge arriving in the centre, contact form underneath.
   Palette taken from the logo: deep navy, violet, rim blue, orange/magenta. */
:root {
  color-scheme: dark;
  --bg: #05071a;
  --ink: #F2F4FF;
  --soft: #C6CBEA;
  --muted: #9AA0C8;
  --rim: #5B8FD0;
  --orange: #FF8A3D;
  --magenta: #E0447E;
  --field: rgba(255,255,255,.06);
  --field-line: rgba(198,203,234,.26);
  --card: rgba(12,16,44,.55);
  --display: "Michroma", "Eurostile", "Arial Black", sans-serif;
  --body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; overflow-x: clip; }
body {
  min-height: 100vh; min-height: 100svh;
  background: radial-gradient(ellipse 90% 70% at 50% 38%, #141a48 0%, #090c26 50%, var(--bg) 100%) fixed, var(--bg);
  color: var(--ink);
  font-family: var(--body); font-size: 1rem; line-height: 1.6;
}

/* Background layers */
.nebula { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.nebula span { position: absolute; border-radius: 50%; mix-blend-mode: screen; will-change: transform; }
.nebula .n1 { width: 75vmax; height: 60vmax; left: -22vmax; top: -18vmax;
  background: radial-gradient(closest-side, rgba(116,62,200,.42), rgba(116,62,200,0));
  animation: drift1 46s ease-in-out infinite alternate; }
.nebula .n2 { width: 70vmax; height: 55vmax; right: -24vmax; bottom: -22vmax;
  background: radial-gradient(closest-side, rgba(56,110,205,.36), rgba(56,110,205,0));
  animation: drift2 58s ease-in-out infinite alternate; }
.nebula .n3 { width: 48vmax; height: 40vmax; right: -6vmax; top: 4vmax;
  background: radial-gradient(closest-side, rgba(224,68,126,.22), rgba(224,68,126,0));
  animation: drift3 38s ease-in-out infinite alternate; }
.nebula .n4 { width: 42vmax; height: 34vmax; left: 2vmax; bottom: -8vmax;
  background: radial-gradient(closest-side, rgba(255,138,61,.13), rgba(255,138,61,0));
  animation: drift1 52s ease-in-out infinite alternate-reverse; }
@keyframes drift1 { to { transform: translate(14vmax, 9vmax) scale(1.15) rotate(12deg); } }
@keyframes drift2 { to { transform: translate(-16vmax, -7vmax) scale(1.2) rotate(-10deg); } }
@keyframes drift3 { to { transform: translate(-12vmax, 14vmax) scale(.85) rotate(18deg); } }
#space { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; display: block; }

/* Content */
main {
  position: relative; z-index: 2;
  min-height: 100vh; min-height: 100svh;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 56px 16px 32px; text-align: center;
}

.emblem { --size: clamp(150px, min(60vw, 32vh), 300px); /* rings reach 17% beyond this box */
  position: relative; width: var(--size); aspect-ratio: 1; margin: 0 0 calc(var(--size) * .2 + 12px);
  animation: float 8s ease-in-out 2.2s infinite; }
.emblem::before { /* glow behind the badge */
  content: ""; position: absolute; inset: -22%; border-radius: 50%;
  background: radial-gradient(circle, rgba(255,138,61,.30) 0%, rgba(140,70,210,.28) 35%, rgba(60,90,200,.12) 55%, transparent 70%);
  animation: glow-in 2.4s ease-out .3s both, pulse 6s ease-in-out 2.7s infinite;
}
.emblem img { position: relative; z-index: 1; display: block; width: 100%; height: auto;
  filter: drop-shadow(0 18px 40px rgba(0,0,0,.6));
  animation: arrive 1.9s cubic-bezier(.16,.84,.24,1) .25s both; }
.ring { position: absolute; border-radius: 50%; pointer-events: none; }
.ring.r1 { inset: -9%; border: 1px dashed rgba(91,143,208,.45); animation: ring-in 1.4s ease-out 1.3s both, spin 60s linear 1.3s infinite; }
.ring.r2 { inset: -17%; border: 1px solid rgba(198,203,234,.12); animation: ring-in 1.4s ease-out 1.6s both, spin 90s linear 1.6s infinite reverse; }
.ring.r1::after, .ring.r2::after { content: ""; position: absolute; border-radius: 50%; }
.ring.r1::after { top: 50%; left: 0; transform: translate(-50%, -50%); width: 7px; height: 7px; background: var(--orange); box-shadow: 0 0 12px var(--orange); }
.ring.r2::after { bottom: 14.6%; right: 14.6%; transform: translate(50%, 50%); width: 5px; height: 5px; background: var(--ink); box-shadow: 0 0 10px rgba(255,255,255,.8); }

@keyframes arrive {
  0%   { opacity: 0; transform: translateY(40px) scale(.35) rotate(-28deg); filter: blur(16px) drop-shadow(0 18px 40px rgba(0,0,0,.6)); }
  60%  { opacity: 1; filter: blur(0) drop-shadow(0 18px 40px rgba(0,0,0,.6)); }
  100% { opacity: 1; transform: none; filter: blur(0) drop-shadow(0 18px 40px rgba(0,0,0,.6)); }
}
@keyframes glow-in { from { opacity: 0; transform: scale(.4); } to { opacity: 1; transform: none; } }
@keyframes pulse { 50% { opacity: .65; transform: scale(.94); } }
@keyframes ring-in { from { opacity: 0; scale: .7; } to { opacity: 1; scale: 1; } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes float { 50% { transform: translateY(-10px); } }

.rise { animation: rise 1s cubic-bezier(.2,.8,.2,1) var(--d, 1.4s) both; }
@keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }

.eyebrow { margin: 0 0 14px; font-size: .78rem; font-weight: 500; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); }
h1 {
  margin: 0 0 16px; font-family: var(--display); font-weight: 400; text-transform: uppercase;
  font-size: clamp(1.7rem, 6vw, 3.4rem); line-height: 1.1; letter-spacing: .06em;
  background: linear-gradient(180deg, #FFFFFF 30%, #B9C2F0 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  text-shadow: 0 0 40px rgba(140,160,255,.15);
}
.lede { margin: 0 auto 34px; max-width: 46ch; color: var(--soft); font-size: 1.05rem; text-wrap: balance; }

/* Contact form */
form {
  width: min(100%, 540px); padding: 24px; text-align: left;
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px;
  background: linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.02)), var(--card);
  border: 1px solid rgba(198,203,234,.18); border-radius: 18px;
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 30px 70px -30px rgba(0,0,0,.9);
}
.form-title { grid-column: 1 / -1; margin: 0 0 2px; font-family: var(--display); font-size: .82rem; letter-spacing: .14em; text-transform: uppercase; }
.field { display: grid; gap: 6px; min-width: 0; }
.field.full { grid-column: 1 / -1; }
label { font-size: .74rem; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
input, textarea {
  width: 100%; font: inherit; font-size: 1rem; color: var(--ink);
  background: var(--field); border: 1px solid var(--field-line); border-radius: 10px;
  padding: 11px 13px; transition: border-color .2s, box-shadow .2s, background .2s;
}
textarea { resize: vertical; min-height: 116px; }
input::placeholder, textarea::placeholder { color: rgba(198,203,234,.45); }
input:focus, textarea:focus { outline: none; border-color: var(--rim); background: rgba(255,255,255,.09); box-shadow: 0 0 0 3px rgba(91,143,208,.28); }
.actions { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; gap: 12px 16px; flex-wrap: wrap; margin-top: 4px; }
.direct { margin: 0; font-size: .86rem; color: var(--muted); }
.direct a { color: var(--soft); text-underline-offset: 3px; }
.direct a:hover { color: var(--ink); }
button {
  font-family: var(--display); font-size: .72rem; letter-spacing: .12em; text-transform: uppercase;
  padding: 14px 26px; border: 0; border-radius: 999px; cursor: pointer; color: #160a20;
  background: linear-gradient(90deg, #FFC14A, var(--orange) 45%, var(--magenta));
  box-shadow: 0 10px 30px -10px rgba(255,120,70,.7);
  transition: transform .15s, box-shadow .2s, filter .2s;
}
button:hover { transform: translateY(-1px); box-shadow: 0 14px 36px -10px rgba(255,120,70,.9); filter: brightness(1.06); }
button:focus-visible, .direct a:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
.status { grid-column: 1 / -1; margin: 0; font-size: .9rem; color: var(--soft); }
.status:empty { display: none; }

footer { position: relative; z-index: 2; padding: 0 16px 28px; text-align: center; font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }

@media (max-width: 560px) {
  main { padding-top: 40px; }
  .eyebrow { font-size: .72rem; letter-spacing: .14em; }
  form { grid-template-columns: minmax(0, 1fr); padding: 20px 16px; }
  .actions { flex-direction: column-reverse; align-items: stretch; text-align: center; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; }
  .nebula span, .ring, .emblem { animation: none !important; }
}
</style>
</head>
<body>
<div class="nebula" aria-hidden="true"><span class="n1"></span><span class="n2"></span><span class="n3"></span><span class="n4"></span></div>
<canvas id="space" aria-hidden="true"></canvas>

<main>
  <div class="emblem">
    <div class="ring r1" aria-hidden="true"></div>
    <div class="ring r2" aria-hidden="true"></div>
    <img src="assets/kratos-logo.webp" width="640" height="649" alt="Kratos logo: an astronaut lifting a barbell inside a round badge">
  </div>

  <p class="eyebrow rise" style="--d:1.5s">Resistance training for microgravity</p>
  <h1 class="rise" style="--d:1.65s">Coming soon</h1>
  <p class="lede rise" style="--d:1.8s">We are building a compact training device that gives astronauts real resistance in space. Want to collaborate, give feedback or follow along? Write to us.</p>

  <form id="contact" class="rise" style="--d:2s" action="mailto:info@kratos-space.ch" method="post" enctype="text/plain">
    <p class="form-title">Get in touch</p>
    <div class="field">
      <label for="name">Name</label>
      <input id="name" name="name" type="text" autocomplete="name" required>
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" required>
    </div>
    <div class="field full">
      <label for="message">Message</label>
      <textarea id="message" name="message" rows="4" placeholder="What would you like to tell us?" required></textarea>
    </div>
    <p class="status" id="status" role="status" aria-live="polite"></p>
    <div class="actions">
      <p class="direct">or email <a href="mailto:info@kratos-space.ch">info@kratos-space.ch</a></p>
      <button type="submit">Send message</button>
    </div>
  </form>
</main>

<footer>© 2026 Kratos Space · Zürich, Switzerland</footer>

<script>
/* Contact form: the site is static (GitHub Pages), so "Send" opens the
   visitor's own mail app with the message filled in, addressed to TO.
   Without JavaScript the form's mailto: action does the same, less tidily. */
(function () {
  var TO = 'info@kratos-space.ch';
  var form = document.getElementById('contact');
  var status = document.getElementById('status');
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var name = form.elements.name.value.trim();
    var email = form.elements.email.value.trim();
    var message = form.elements.message.value.trim();
    if (!name || !message) {
      status.textContent = 'Please fill in your name and a message.';
      (name ? form.elements.message : form.elements.name).focus();
      return;
    }
    var subject = 'Message from ' + name + ' via kratos-space.ch';
    var body = (message + '\n\n-- \n' + name + '\n' + email).replace(/\r?\n/g, '\r\n');
    window.location.href = 'mailto:' + TO + '?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);
    status.textContent = 'Your mail app should now open with the message ready to send. If nothing opens, write to ' + TO + ' directly.';
  });
})();

/* Background: slow flight through a rotating starfield plus the odd
   shooting star. Star positions are normalised, so resizing never
   reshuffles the field. Respects prefers-reduced-motion (one static frame). */
(function () {
  var canvas = document.getElementById('space');
  var ctx = canvas.getContext('2d');
  var still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var TINTS = ['255,255,255', '255,255,255', '255,255,255', '205,220,255', '190,205,255', '255,214,170', '255,175,205'];
  var SPEED = 1 / 32000;   // depth units per ms: a star takes ~30 s from far to near
  var SPIN = 0.0000045;    // rad per ms: one full turn takes ~23 min
  var W, H, R, stars = [], meteors = [], angle = 0, last = 0, nextMeteor = 3500;

  function makeStar(z) {
    return {
      x: Math.random() * 2 - 1, y: Math.random() * 2 - 1, z: z,
      tint: TINTS[(Math.random() * TINTS.length) | 0],
      phase: Math.random() * 6.283, rate: 0.0008 + Math.random() * 0.0022
    };
  }

  function resize() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight; R = Math.hypot(W, H) / 2;
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var want = Math.min(2400, Math.round((4 * R * R) / 1700));
    while (stars.length < want) stars.push(makeStar(0.06 + Math.random() * 0.94));
    if (stars.length > want) stars.length = want;
    if (still) draw(0, 0);
  }

  function spawnMeteor() {
    var a = Math.PI * (0.12 + Math.random() * 0.18);
    var dir = Math.random() < 0.5 ? 1 : -1;
    meteors.push({
      x: W * (0.15 + Math.random() * 0.7), y: H * Math.random() * 0.45,
      ux: Math.cos(a) * dir, uy: Math.sin(a),
      len: 120 + Math.random() * 140, life: 0, max: 900 + Math.random() * 600
    });
  }

  function draw(t, dt) {
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    ctx.translate(W / 2, H / 2);
    ctx.rotate(angle);
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      s.z -= dt * SPEED;
      var px = (s.x / s.z) * R, py = (s.y / s.z) * R;
      if (s.z <= 0.06 || px * px + py * py > R * R * 1.1) {
        stars[i] = s = makeStar(1);
        px = s.x * R; py = s.y * R;
      }
      var near = 1 - s.z;
      var size = 0.8 + near * near * 2.4;
      var alpha = Math.min(1, 0.45 + near * 1.2) * (0.65 + 0.35 * Math.sin(s.phase + t * s.rate));
      ctx.fillStyle = 'rgba(' + s.tint + ',' + alpha.toFixed(3) + ')';
      if (size < 1.3) {
        ctx.fillRect(px - size / 2, py - size / 2, size, size);
      } else {
        ctx.beginPath(); ctx.arc(px, py, size / 2, 0, 6.283); ctx.fill();
      }
    }
    ctx.restore();

    for (var j = meteors.length - 1; j >= 0; j--) {
      var m = meteors[j];
      m.life += dt;
      if (m.life >= m.max) { meteors.splice(j, 1); continue; }
      m.x += m.ux * dt * 0.95; m.y += m.uy * dt * 0.95;
      var fade = Math.sin(Math.PI * (m.life / m.max));
      var tx = m.x - m.ux * m.len, ty = m.y - m.uy * m.len;
      var g = ctx.createLinearGradient(m.x, m.y, tx, ty);
      g.addColorStop(0, 'rgba(255,240,225,' + (0.95 * fade).toFixed(3) + ')');
      g.addColorStop(0.25, 'rgba(255,160,110,' + (0.45 * fade).toFixed(3) + ')');
      g.addColorStop(1, 'rgba(160,110,255,0)');
      ctx.strokeStyle = g; ctx.lineWidth = 1.6; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(m.x, m.y); ctx.lineTo(tx, ty); ctx.stroke();
    }
  }

  function frame(t) {
    var dt = last ? Math.min(t - last, 50) : 0;
    last = t;
    angle += dt * SPIN;
    if (t > nextMeteor) { spawnMeteor(); nextMeteor = t + 5000 + Math.random() * 7000; }
    draw(t, dt);
    window.requestAnimationFrame(frame);
  }

  window.addEventListener('resize', resize);
  resize();
  if (!still) window.requestAnimationFrame(frame);
})();
</script>
</body>
</html>
